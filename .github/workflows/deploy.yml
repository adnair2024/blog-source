name: Deploy Hugo Blog to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo site
        run: hugo --minify --baseURL "https://adnair2024.github.io/blog/"

      - name: Deploy to adnair2024.github.io/blog/
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAT }}
          external_repository: adnair2024/adnair2024.github.io
          publish_branch: main
          publish_dir: ./public
          destination_dir: blog
          keep_files: true
          force_orphan: false
